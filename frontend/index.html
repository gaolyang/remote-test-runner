<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remote Test Runner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Remote Test Runner</h1>
      <p>远程测试自动执行与证据采集系统</p>
    </div>
    <span id="connection-badge" class="badge">未连接</span>
  </header>

  <main>
    <section id="start-panel" class="panel start-panel">
      <h2>启动测试</h2>
      <form id="start-form">
        <label>测试案例
          <select id="testcase" name="testcase" required></select>
        </label>
        <label>目标主机
          <input id="host" name="host" placeholder="192.168.10.20" required autocomplete="off">
        </label>
        <label>端口
          <input id="port" name="port" type="number" value="22" min="1" max="65535" required>
        </label>
        <label>SSH 用户名
          <input id="username" name="username" value="root" required autocomplete="username">
        </label>
        <label>SSH 密码（仅保存在运行内存）
          <input id="password" name="password" type="password" autocomplete="current-password">
        </label>
        <label>私钥路径（可选，控制端本地路径）
          <input id="key-filename" name="key_filename" placeholder="C:\\Users\\me\\.ssh\\id_ed25519" autocomplete="off">
        </label>
        <button id="start-button" type="submit" class="primary">Start Test</button>
      </form>
      <p id="form-error" class="error" role="alert"></p>
    </section>

    <section id="runner-panel" class="runner-grid hidden">
      <aside class="panel sidebar">
        <h2>Steps</h2>
        <ol id="step-list"></ol>
      </aside>

      <div class="workspace">
        <section class="panel summary">
          <div><span>Case</span><strong id="case-summary">—</strong></div>
          <div><span>Target</span><strong id="target-summary">—</strong></div>
          <div><span>Status</span><strong id="status-summary">—</strong></div>
          <div><span>Progress</span><strong id="progress-summary">—</strong></div>
          <p id="status-message"></p>
        </section>

        <section id="evidence-area" class="panel evidence-area">
          <div class="evidence-header">
            <div><span>Case ID</span><strong id="evidence-case-id">—</strong></div>
            <div><span>Case Name</span><strong id="evidence-case-name">—</strong></div>
            <div><span>Target Host</span><strong id="evidence-target">—</strong></div>
            <div><span>Step</span><strong id="evidence-step">—</strong></div>
            <div><span>Timestamp</span><strong id="evidence-time">—</strong></div>
          </div>
          <div id="terminal" aria-label="SSH terminal"></div>
          <pre id="terminal-fallback" class="terminal-fallback hidden"></pre>
          <div class="evidence-footer">
            <div><span>Expected</span><strong id="evidence-expected">—</strong></div>
            <div><span>Result</span><strong id="evidence-result">—</strong></div>
          </div>
        </section>

        <section id="controls" class="controls">
          <button id="capture-button" type="button">Capture Evidence</button>
          <button id="confirm-button" type="button" class="warning" disabled>Confirm Risk &amp; Run</button>
          <button id="abort-button" type="button" class="danger">Abort</button>
          <span id="action-message"></span>
        </section>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="/assets/terminal.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
