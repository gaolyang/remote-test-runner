version: '1.0'
testcase:
  id: TC_SYSTEM_002
  name: 查看内核版本与内核参数
  description: ''
target:
  connection:
    type: ssh
steps:
- id: 1
  role: verify
  name: 查看完整内核信息
  action:
    type: shell
    command: uname -a
  expected:
    exit_code: 0
    stdout_contains:
    - 1. 输出包含主机名、内核版本、编译时间、架构（如 x86_64 / aarch64）
    - 2. 输出形如 5.x.x-xxx 的内核版本号，且与第 1 步中的版本一致
    - 3. 输出 GCC 编译版本与内核版本，内容非空
    - 4. 返回 fs.file-max 的具体数值，且大于 0
- id: 2
  role: verify
  name: 仅查看内核发行版本号
  action:
    type: shell
    command: uname -r
  expected:
    exit_code: 0
    stdout_contains:
    - 1. 输出包含主机名、内核版本、编译时间、架构（如 x86_64 / aarch64）
    - 2. 输出形如 5.x.x-xxx 的内核版本号，且与第 1 步中的版本一致
    - 3. 输出 GCC 编译版本与内核版本，内容非空
    - 4. 返回 fs.file-max 的具体数值，且大于 0
- id: 3
  role: verify
  name: 查看内核编译信息
  action:
    type: shell
    command: cat /proc/version
  expected:
    exit_code: 0
    stdout_contains:
    - 1. 输出包含主机名、内核版本、编译时间、架构（如 x86_64 / aarch64）
    - 2. 输出形如 5.x.x-xxx 的内核版本号，且与第 1 步中的版本一致
    - 3. 输出 GCC 编译版本与内核版本，内容非空
    - 4. 返回 fs.file-max 的具体数值，且大于 0
- id: 4
  role: verify
  name: 查看内核关键参数（如文件句柄上限）
  action:
    type: shell
    command: sysctl fs.file-max
  expected:
    exit_code: 0
    stdout_contains:
    - 1. 输出包含主机名、内核版本、编译时间、架构（如 x86_64 / aarch64）
    - 2. 输出形如 5.x.x-xxx 的内核版本号，且与第 1 步中的版本一致
    - 3. 输出 GCC 编译版本与内核版本，内容非空
    - 4. 返回 fs.file-max 的具体数值，且大于 0
